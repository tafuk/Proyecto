<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Parqueadero Reyes Sánchez</title>
    <link rel="icon" href="../img/LOGO.jpeg">
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/formularios.css">
    <link rel="stylesheet" href="https://unpkg.com/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

    <div class="contenedor-formulario">

        <div class="encabezado">
            <img src="../img/LOGO.jpeg" alt="Parqueadero Reyes Sánchez" class="logo">
            <h2 style="color: var(--color-primario);">Crear cuenta</h2>
        </div>

        <form id="formRegistroCuenta">

            <label for="usuario">Nombre de usuario:</label>
            <input type="text" name="usuario" id="usuario" required>

            <label for="contrasena">Contraseña:</label>
            <input type="password" name="contrasena" id="contrasena" required minlength="6">

            <label for="confirmar">Confirmar contraseña:</label>
            <input type="password" name="confirmar" id="confirmar" required minlength="6">
            <small class="ayuda" id="errorConfirmar" style="display:none; color:#b3261e;">Las contraseñas no coinciden.</small>

            <label for="rol">Rol:</label>
            <select name="rol" id="rol">
                <option value="admin">Admin</option>
                <option value="empleado">Empleado</option>
            </select>

            <button type="submit">Registrarse</button>
        </form>

        <div class="volver">
            <a href="../index.html">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
    </div>

    <footer class="site-footer-auth">
        <p>&copy; <span id="footerYear"></span> Parqueadero Reyes Sánchez. Todos los derechos reservados.</p>
    </footer>

    <script src="../js/db.js"></script>
    <script src="../js/script.js"></script>
    <script>
        document.getElementById("formRegistroCuenta").addEventListener("submit", function (evento) {
            evento.preventDefault();

            const usuario = document.getElementById("usuario").value.trim();
            const contrasena = document.getElementById("contrasena").value;
            const confirmar = document.getElementById("confirmar").value;
            const rol = document.getElementById("rol").value;
            const errorConfirmar = document.getElementById("errorConfirmar");

            if (contrasena !== confirmar) {
                errorConfirmar.style.display = "block";
                return;
            }
            errorConfirmar.style.display = "none";

            // Mientras no exista backend, la cuenta creada se guarda como un
            // usuario más del sistema (visible en el listado de Usuarios).
            DB.agregar(DB.KEYS.usuarios, { nombre: usuario, apellido: "", iden: "", rol });

            window.location.href = "../index.html";
        });
    </script>
</body>
</html>
